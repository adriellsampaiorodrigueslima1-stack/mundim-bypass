services:
  - type: web
    name: mundim-bypass
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:standalone
    startCommand: pnpm run start:standalone
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_GATEWAY_BASE_URL
        sync: false
      - key: ARCADE_CORS_ORIGINS
        sync: false
      - key: ARCADE_API_KEYS
        sync: false
      - key: GATEWAY_SESSION_IDLE_MS
        value: "1800000"
